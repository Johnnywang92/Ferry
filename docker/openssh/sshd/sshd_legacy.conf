# 老设备仿真：只放开 ssh-rsa(SHA-1) 主机密钥 + CBC + hmac-sha1 + DH-SHA1。
# 用于 M1' 的 AlgorithmMatrix 连通矩阵，验证"允许弱算法"开关是否真的必要。
#
# 注意：这是"现代 OpenSSH 关到只剩老算法"，不等于 2010 年的 NAS 固件。
# 遇到 Alpine/OpenSSH 已彻底移除的算法（如 ssh-dss、dh-group1-sha1），
# 需在 SecurityBaseline.md 记录并改用更老的镜像。
Port 22
ListenAddress 0.0.0.0

Subsystem sftp internal-sftp

PasswordAuthentication yes
PubkeyAuthentication yes
KbdInteractiveAuthentication no

HostKey /etc/ssh/ssh_host_rsa_key
HostKeyAlgorithms ssh-rsa
PubkeyAcceptedAlgorithms +ssh-rsa
KexAlgorithms diffie-hellman-group14-sha1,diffie-hellman-group14-sha256
Ciphers aes128-cbc,aes256-cbc
MACs hmac-sha1

MaxSessions 10
MaxStartups 10:30:100
LogLevel DEBUG
