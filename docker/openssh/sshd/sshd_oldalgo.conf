# 2204：新版 OpenSSH 关到"每个维度只剩一条老路"。
# 与 2203(sshd_legacy.conf) 的差别是有意的：legacy 还允许 diffie-hellman-group14-sha256
# 兜底，客户端不会 SHA-1 KEX 也能连上；这一台不行。这样 AlgorithmMatrix 的每一格
# 才是"算法本身过不过"的测量，而不是"恰好有别的算法能绕"。
#
# 仍然不等于 2010 年的 NAS 固件（那台在 2205）：这里能给的只有 6.x 之后还活着的算法，
# ssh-dss、diffie-hellman-group1-sha1、hmac-md5、3des-cbc 在 Alpine 的 9.7 里已经拿掉了。
Port 22
ListenAddress 0.0.0.0

Subsystem sftp internal-sftp

PasswordAuthentication yes
PubkeyAuthentication yes
KbdInteractiveAuthentication no
# alpine 的 OpenSSH 未编译 PAM 支持，写 UsePAM 会被判为 Unsupported option

HostKey /etc/ssh/ssh_host_rsa_key
HostKeyAlgorithms ssh-rsa
# 用整值赋值而不是 "+ssh-rsa"：这一台只认 SHA-1 签名，ed25519/ecdsa 密钥在这里必须失败，
# 这正是 M1'-4 要验的"老设备上公钥认证只能走 ssh-rsa"。
PubkeyAcceptedAlgorithms ssh-rsa
# 老设备的密钥常常只有 1024 位，8.8 起的 RequiredRSASize 默认会拒；先对齐到能吃下。
RequiredRSASize 1024
KexAlgorithms diffie-hellman-group14-sha1
Ciphers aes128-cbc,aes256-cbc
MACs hmac-sha1,hmac-sha1-96

MaxSessions 10
MaxStartups 10:30:100
LogLevel DEBUG
